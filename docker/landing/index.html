<!--
  The mica.gg / dev.mica.gg landing page.

  Plain hand-written HTML and CSS, no framework, no build step -- these bytes
  are what `docker/serve/main.go` serves at `/`, byte for byte. Deliberately
  self-contained: no Google Fonts, no CDN script, no analytics, no remote
  image. The phone and tablet screenshots are copies of docs/screenshots/home.png
  and tablet-settings.png (regenerate those with web/e2e/screenshots.spec.ts,
  then copy them here), not hotlinks, so this page has no dependency on
  anything outside `docker/landing/`.

  This is a real page for real browsers (mica.gg visitors), not FiveM's CEF --
  the Chromium-103 floor in AGENTS.md §6 and the `cef-css` skill do not apply
  here.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="micaOS: an open-source TypeScript phone and tablet OS for FiveM. Works with qbcore, qbox, esx, or standalone. Try the phone or tablet demo, or install from a release."
    />
    <title>micaOS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>micaOS</h1>
        <p class="tagline">
          An open-source, in-game phone and tablet OS for FiveM. Works with
          <strong>qbcore</strong>, <strong>qbox</strong>, <strong>esx</strong>, or standalone. Ships
          with an SDK for building your own add-ons, and installs from a release zip.
        </p>
        <p class="license">AGPL-3.0-or-later</p>
        <nav class="links" aria-label="micaOS">
          <a class="button primary" href="./demo/?device=phone">Phone demo</a>
          <a class="button primary" href="./demo/?device=tablet">Tablet demo</a>
          <a class="button" href="https://docs.mica.gg/">Docs</a>
          <a class="button" href="https://github.com/quissicutdeus/mica/releases/latest"
            >Latest release</a
          >
          <a class="button" href="https://github.com/quissicutdeus/mica">GitHub</a>
        </nav>
      </header>

      <!--
        Two slides in a CSS scroll-snap track: it swipes on touch and scrolls with a
        trackpad or the arrow keys with no script at all. The script below only makes
        the Phone/Tablet tabs move the track and follow it.
      -->
      <section class="gallery" aria-label="Screenshots">
        <div class="gallery-tabs" role="tablist" aria-label="Device">
          <button
            type="button"
            role="tab"
            id="tab-phone"
            aria-controls="shot-phone"
            aria-selected="true"
          >
            Phone
          </button>
          <button
            type="button"
            role="tab"
            id="tab-tablet"
            aria-controls="shot-tablet"
            aria-selected="false"
          >
            Tablet
          </button>
        </div>
        <div class="gallery-track" tabindex="0" aria-label="Screenshots, scroll sideways for more">
          <figure class="slide" id="shot-phone" role="tabpanel" aria-labelledby="tab-phone">
            <img
              src="./screenshot-phone.png"
              width="646"
              height="1374"
              alt="The micaOS phone home screen: a launcher grid of apps including Phone, Messages, Contacts, Camera, Media and Bank, framed as an in-game phone."
            />
          </figure>
          <figure class="slide" id="shot-tablet" role="tabpanel" aria-labelledby="tab-tablet">
            <img
              src="./screenshot-tablet.png"
              width="2112"
              height="1320"
              loading="lazy"
              alt="The micaOS tablet showing Settings in two panes: a list of sections on the left and the Display section, with its theme preview and colour picker, on the right."
            />
          </figure>
        </div>
      </section>
      <script>
        (() => {
          const track = document.querySelector('.gallery-track');
          const tabs = [...document.querySelectorAll('.gallery-tabs [role="tab"]')];
          const slides = tabs.map((tab) =>
            document.getElementById(tab.getAttribute('aria-controls'))
          );
          const select = (index) =>
            tabs.forEach((tab, i) => tab.setAttribute('aria-selected', String(i === index)));
          tabs.forEach((tab, i) =>
            tab.addEventListener('click', () => {
              track.scrollTo({ left: slides[i].offsetLeft - track.offsetLeft, behavior: 'smooth' });
              select(i);
            })
          );
          track.addEventListener(
            'scroll',
            () => select(Math.round(track.scrollLeft / track.clientWidth)),
            {
              passive: true
            }
          );
        })();
      </script>
    </main>
  </body>
</html>

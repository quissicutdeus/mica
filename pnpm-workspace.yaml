packages:
  - 'shared'
  - 'sdk'
  - 'web'

# pnpm 10.16+ honours this: a version published fewer than this many minutes ago is not
# installed, and resolution falls back to the newest one that is old enough. Three days is
# longer than a hijacked release has historically stayed on the registry before being
# pulled, so a `pnpm add` or a lockfile refresh cannot land on one by accident (MICA-199).
# `pnpm dlx` reads it too, so the release job's publint is covered.
minimumReleaseAge: 4320

# svelte-eslint-parser 1.9.0 asks for "the newest typescript it can find" and gets root's
# 7.x, whose main export is only a version string, so lint crashes on any .svelte file
# without a <script lang="ts"> (MICA-402). Drop this once a fixed release is old enough.
overrides:
  svelte-eslint-parser: 1.8.1

allowBuilds:
  esbuild: false

onlyBuiltDependencies:
  - esbuild

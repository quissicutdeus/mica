name: Integration

# MICA-302: the in-server integration suite, on demand. `release.yml` runs the same suite
# before a release, on main; this exists so a change can be proven on dev, or on any other
# ref, before main moves. The box runs it three times, standalone, then against qbx_core and
# ox_inventory, then against es_extended and ox_inventory (MICA-304), and all three are this
# job's verdict:
#
#   gh workflow run integration.yml --ref dev
#
# By hand only. The suite takes a real FXServer and a real MariaDB on the game server for
# several minutes and shares that box's one licence key with the release smoke test, so it
# does not run on every push. It builds the ref it is dispatched on and nothing else.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration suite on the FiveM box
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm 11
        with:
          version: 11

      - name: Install Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: 'pnpm'

      # --ignore-scripts: the root "prepare" script installs dev git hooks, which a CI job
      # has no use for.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `build:nocheck`: this job answers whether the suite passes, not whether the tree
      # typechecks, which Verify already says on the same push. It builds the resource,
      # and the suite with it.
      - name: Build the resource and the suite
        run: pnpm build:nocheck

      - name: Pack the resource and the suite into one zip
        run: pnpm pack:integration

      # A missing secret is a failure, not a skip: a run that quietly stood down because it
      # was not configured would read as a pass. The step fails on ssh's own exit, which is
      # the wrapper's, which runs the suite in every mode every time and fails on any FAIL,
      # on a missing done line, on a suite that ran nothing and on a scenario that was not run
      # or skipped as the zip lists -- naming the mode, `[standalone mode]`, `[qbx mode]` or
      # `[esx mode]`.
      # RUN_CHECKED_REQUIRE adds what an exit status cannot say: that the log holds a pass line
      # for each mode, so a wrapper edited to leave one out and reinstalled is red here.
      # It also fails when the wrapper hoth ran is not this checkout's copy:
      # `run-checked.sh` holds the session's output to the wrapper's identity line, so a
      # reinstall nobody did is a red step naming the command to run, not an old suite
      # quietly judging a new tree. scripts/deploy/README.md has the server side.
      - name: Run the integration suite on the FiveM box (standalone, qbx, then esx)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SMOKE_KEY: ${{ secrets.DEPLOY_KEY_SMOKE }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RUN_CHECKED_REQUIRE: |
            [standalone mode] integration suite passed
            [qbx mode] integration suite passed
            [esx mode] integration suite passed
            integration passed in every run
        run: |
          for name in DEPLOY_HOST SMOKE_KEY KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error title=Integration not run::${name} is not set (secret DEPLOY_KEY_SMOKE, DEPLOY_HOST or DEPLOY_KNOWN_HOSTS), so the suite could not run. scripts/deploy/README.md has the setup."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          echo "$SMOKE_KEY" > ~/.ssh/smoke_key
          chmod 600 ~/.ssh/smoke_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "running the integration suite on the FiveM box"
          sh scripts/deploy/run-checked.sh mica-smoke-release.sh \
            ssh -i ~/.ssh/smoke_key -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            gphone@"$DEPLOY_HOST" < dist/integration/mica-integration-run.zip

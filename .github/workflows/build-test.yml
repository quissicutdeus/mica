name: Verify
on: [push, pull_request]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
        pnpm-version: [10]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm ${{ matrix.pnpm-version }}
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web

      # The same command a developer runs, so the two cannot drift. This used to be
      # `test:unit` and `build` only, which left the e2e suite and the formatter
      # enforced nowhere — seventy-one tests free to go red without anything saying so.
      - name: Verify
        run: pnpm verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

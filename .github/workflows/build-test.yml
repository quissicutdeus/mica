name: Verify
on:
  # A PR's synchronize event already runs this on every push to a branch with an open
  # PR, so an unscoped `push` trigger doubled every run for no benefit. Scoped to main
  # and dev: the branches where a direct push — a merge landing, or the periodic
  # keep-dev-in-sync merge — deserves its own confirmation that things are still green.
  # That carve-out re-created the double once dev became a permanent PR head; the `if` on
  # each job below is what actually settles it.
  push:
    branches: [main, dev]
  pull_request:

# Supersede a pull request's own in-flight runs; never a push's.
#
# Pushing three times in a minute to a PR branch started three full ~6m verifies, two of
# them already answering a question about a commit nobody would ever merge. Cancelling
# those costs nothing: the only run whose answer anybody wants is the one for the tip.
#
# Pushes are deliberately exempt, and the group expression is what exempts them.
# `github.run_id` is unique per run, so every push lands in a group of its own and can be
# neither cancelled nor queued behind a sibling. That matters twice over: deploy.yml keys
# off this workflow's *completion*, so a cancelled run on main or dev is a deploy that
# silently never happens -- and grouping pushes by ref instead would have serialised them,
# trading a doubled run for a queued one rather than removing any work.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Skip the standing "Release: sync dev into main" PR, whose head branch is dev.
    #
    # The trigger comment above scoped `push` to main and dev so a direct push gets its own
    # confirmation. That was right when nothing else watched those branches, and became a
    # duplicate the day dev became a permanent PR head: every push to dev then fired both
    # this workflow's `push` trigger and that PR's `synchronize`, on the same sha, ~3s
    # apart — two full ~5m runs of identical work, every commit. `deploy.yml` already
    # carries half of this story; it saw the same double as two deploys.
    #
    # Filtering by head branch has to be a job condition: `on.pull_request.branches`
    # filters the *base*, which is main here and is not what distinguishes this PR.
    #
    # The push run is the one kept, deliberately. It tests the dev commit itself; the PR
    # run tests a merge of dev into main, which is a commit that exists nowhere and, for a
    # straight sync PR, resolves to dev's tree anyway. Every other PR — a MICA-<n> branch
    # into dev — is untouched by this and still gets its run.
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    # Pinned to the @playwright/test version in pnpm-lock.yaml (currently 1.62.1). This
    # image ships Chromium and its OS deps preinstalled, replacing what `--with-deps`
    # used to spend a minute-plus on every run downloading/apt-installing. Bump this tag
    # whenever the lockfile's playwright version changes, or the run fails on a missing
    # browser instead of a stale-but-working one.
    #
    # `-resolute` is Ubuntu 26.04 LTS, the newest distro Playwright publishes for this
    # version (the chain runs bionic 18.04 -> focal 20.04 -> jammy 22.04 -> noble 24.04 ->
    # resolute 26.04). Both halves of this tag have to be chosen deliberately: the version
    # tracks the lockfile, and the distro is only available for versions that shipped after
    # it, so a future playwright bump may have no `-resolute` build yet. Check
    # https://mcr.microsoft.com/v2/playwright/tags/list before changing either half.
    container: mcr.microsoft.com/playwright:v1.62.1-resolute
    # Matched to the development machine on purpose, rather than to whatever is LTS.
    #
    # pnpm is the half that matters most: it is what writes pnpm-lock.yaml, and `pnpm
    # install --frozen-lockfile` below is the first thing that runs. A CI pnpm older than
    # the one a developer commits with is a CI failure waiting on the next lockfile format
    # bump, and it would surface here and nowhere else.
    #
    # Node 26 is Current, not LTS, until 2026-10-28. That is the trade accepted here: this
    # repo is built on 26, so 26 is what gets tested. Nothing about the shipped resource
    # depends on it — FiveM runs its own JS runtime, and this version only ever builds.
    strategy:
      matrix:
        node-version: [26]
        pnpm-version: [11]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm ${{ matrix.pnpm-version }}
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        # --ignore-scripts: same reason the Dockerfile uses it -- the root "prepare"
        # script installs dev git hooks, which CI never needs and which fails here
        # anyway (git's safe.directory check rejects the checkout's ownership).
        run: pnpm install --frozen-lockfile --ignore-scripts

      # tsc's incremental .tsbuildinfo and Vite's dep-optimization cache both key off
      # content hashes, so restoring last run's cache lets typecheck/build skip work for
      # anything unchanged instead of starting cold every run.
      #
      # `node_modules/.cache` is ESLint's and Prettier's, and it is the one that matters
      # most: `lint` is type-aware across ~865 files and takes ~120s cold against ~2s warm.
      # Both key on file content — ESLint only because `web`'s lint script passes
      # `--cache-strategy content`, and it has to. ESLint's default strategy is mtime+size,
      # and `actions/checkout` writes every file fresh on every run, so this cache restored
      # and then matched nothing: `lint` cost its full ~118s here for weeks while this
      # comment claimed ~1s. Reproduced locally by touching every file without editing it —
      # 2.7s became 122s under the default strategy, and stayed 1.7s under `content`.
      # Content hashing means a restored entry can only ever skip a file that has not
      # changed, so a stale entry is not a way for a real error to get through.
      - name: Cache TypeScript/Vite build state
        uses: actions/cache@v6
        with:
          path: |
            **/*.tsbuildinfo
            web/node_modules/.vite
            **/node_modules/.cache
          key: build-state-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-state-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-state-${{ runner.os }}-

      # The same command a developer runs, so the two cannot drift. This used to be
      # `test:unit` and `build` only, which left the e2e suite and the formatter
      # enforced nowhere — seventy-one tests free to go red without anything saying so.
      - name: Verify
        run: pnpm verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # A second job rather than more steps on `verify`: that one runs inside the Playwright
  # container image, which has no Go toolchain, no hadolint and no Docker daemon. It also
  # means a Svelte-only change gets its verdict from `verify` without waiting on an image
  # build, and the two run in parallel.
  container:
    name: Demo container
    runs-on: ubuntu-latest
    # Same carve-out as `verify` above, for the same reason — this job doubled too.
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # setup-go's `cache` is the *module* cache, and docker/serve is stdlib-only:
          # there is no go.sum, nothing to restore, and leaving it on only produces a
          # missing-dependency-file warning every run. The build cache is a different
          # directory and is very much worth keeping -- see the step below.
          cache: false

      # The Go *build* cache, which is where the compiled stdlib lives. Recompiling that
      # from scratch is nearly all of what `go vet ./...` and `go build ./...` cost on a
      # cold runner, and until the `has('go')` fix in scripts/lint-container.js this step
      # would have cached nothing anybody used -- every check was silently running inside
      # golang:1-alpine instead of against the toolchain installed above.
      #
      # Keyed on the sources, falling back to any cache for the same Go version: editing
      # main.go should still start from a cache with the stdlib already compiled and
      # recompile only the package that changed. The version comes from setup-go's own
      # output so this key cannot drift from the toolchain it describes.
      - name: Cache the Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('docker/serve/go.mod', 'docker/serve/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-

      - name: Install hadolint
        run: |
          curl -sSLo /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      # --require is the whole point of this job. lint-container.js reports a missing
      # toolchain as *skipped* so a developer without Go can still push; this flag turns
      # that into a failure, so the checks are guaranteed to have actually run somewhere.
      - name: Lint the Go server and the Dockerfile
        run: node scripts/lint-container.js --require

      # A container-driver builder. `cache-to` needs one: the default `docker` driver
      # cannot export a build cache at all, so without this the next step would warn and
      # cache nothing.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `bake` rather than `docker compose build`, so compose.yaml stays the single
      # definition of how this image gets built -- bake reads it natively, and the `set`
      # lines below add caching without writing a CI-only concern into a file `pnpm demo`
      # also reads. The build args stay valueless there (pass through only if set), which
      # is why they are supplied here instead; .dockerignore keeps .git out of the build
      # context precisely so the version stamp cannot fall back to `git rev-parse` and
      # produce a stale-but-plausible answer inside the container.
      #
      # The Dockerfile's own `--mount=type=cache` mounts -- the pnpm store, the Go build
      # cache -- are worth having locally and worth exactly nothing here: BuildKit cache
      # mounts do not survive across runners, so every CI build started stone cold. The
      # server stage is most of the wall clock (`go build` ~19s and `upx --best` ~24s of a
      # ~47s build) and docker/serve/main.go changes about never, so it should be a hit
      # nearly every run.
      #
      # mode=max, not the default: the expensive layers are in the `web` and `server`
      # stages, and the final stage is FROM scratch. The default caches only what the
      # final stage ships -- one binary and one directory -- which would cache neither of
      # the two steps actually worth caching.
      #
      # This shares the repo's 10GB Actions cache budget with the pnpm and build-state
      # entries in the job above. Well inside it today (~1.9GB used); if that ever starts
      # evicting, this is the entry to shrink first.
      - name: Build the image
        uses: docker/bake-action@v7
        with:
          # `source: .` is not a default and not a tidy-up. Left unset, bake-action builds
          # from the *Git* context rather than the checkout -- which silently discards
          # .dockerignore and every file any earlier step wrote. This job exists to test
          # the tree that was checked out, and the Dockerfile depends on .dockerignore
          # keeping .git out of the context (see the GIT_SHA note above).
          source: .
          files: compose.yaml
          targets: demo
          load: true
          set: |
            demo.cache-from=type=gha
            demo.cache-to=type=gha,mode=max
            demo.args.GIT_BRANCH=${{ github.ref_name }}
            demo.args.GIT_SHA=${{ github.sha }}

      # `docker build` succeeding proves the image assembles, not that it serves.
      - name: Start it
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q demo)" 2>/dev/null || echo starting)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 1
          done
          echo "container never became healthy (last status: ${status:-unknown})" >&2
          docker compose logs --no-log-prefix demo >&2
          exit 1

      - name: Smoke test
        run: node scripts/smoke-image.js

      - name: Server logs
        if: failure()
        run: docker compose logs --no-log-prefix demo

      - name: Stop it
        if: always()
        run: docker compose down

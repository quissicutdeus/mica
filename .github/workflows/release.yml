name: Release

# Only on push to main: main only advances via merge from development
# (see AGENTS.md / the branching note in README), so every push here is a
# real ship, and a tag/release cut on every commit to development would
# mean dozens a day. Tagging main is what "release" is supposed to mean.
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not the default shallow clone: the CalVer below
          # counts every commit on HEAD's date across the whole log, and
          # must match web/vite.config.ts's getCalVer() exactly (same git
          # log, same field order) or the tag and the About screen disagree.
          fetch-depth: 0

      - name: Compute CalVer and tag
        id: tag
        run: |
          dates=$(git log --format=%cd --date=format:%Y.%m.%d)
          date=$(echo "$dates" | head -1)
          count=$(echo "$dates" | grep -c "^$date\$")
          tag="v${date}.${count}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      # MICA-125: the release is where @gphone/sdk is published.
      #
      # Not npm, deliberately -- an npm name is permanent, publishing means keeping two
      # packages in lockstep forever, and the git-dependency path MICA-175 proved already
      # works. A versioned tarball on the release that already exists gets an outside
      # add-on author a real version to pin without taking that one-way door. The reasoning
      # is on the ticket and in scripts/pack-release.js.
      #
      # No `pnpm install` and no `cache: 'pnpm'`: `pnpm pack` reads a manifest and archives
      # files, so nothing here needs node_modules and a cache would be restored for nothing.
      #
      # That held until `shared/` became a package. Resolving a `workspace:` dependency is
      # the one thing pack cannot do from a manifest alone, and this job failed on the first
      # release after it, with ERR_PNPM_CANNOT_RESOLVE_WORKSPACE_PROTOCOL. `pack-release.js`
      # now rewrites those specs itself before packing, so the sentence above is true again
      # rather than merely still written down. `server/__tests__/packRelease.test.ts` checks
      # it on every push, because this workflow only runs on main and found out too late.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.tag.outputs.skip == ''
        name: Install pnpm 11
        with:
          version: 11

      - name: Install Node.js 26
        if: steps.tag.outputs.skip == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      # Both packages or neither: the SDK depends on @gphone/shared, so a consumer given
      # only the first gets a 404 on a dependency it cannot see.
      - name: Pack the SDK and shared
        if: steps.tag.outputs.skip == ''
        run: node scripts/pack-release.js "${{ steps.tag.outputs.tag }}"

      # Lint both tarballs before anything is attached, so a broken `exports` map or a
      # `files` list that dropped a directory fails here rather than at an add-on author's
      # first install. `pnpm dlx` because this job has no node_modules (see above).
      #
      # publint only. @arethetypeswrong/cli was tried and reports an internal resolution
      # error on every JavaScript entrypoint: the SDK ships TypeScript and Svelte source
      # for a bundler to consume, and attw models Node resolving declaration files, which
      # cannot follow a `.svelte` import. The type surface is gated by
      # `sdk/publicSurface.test.ts` (MICA-182, MICA-185) instead.
      - name: Lint the tarballs
        if: steps.tag.outputs.skip == ''
        run: |
          pnpm dlx publint dist/release/gphone-sdk-*.tgz
          pnpm dlx publint dist/release/gphone-shared-*.tgz

      # A checksum file beside the tarballs, and a signed provenance attestation over them
      # (`gh attestation verify <tgz> --repo <owner>/<repo>` checks it). Both cover the
      # tarballs only: this job never builds the resource, so there is no resource zip to
      # attest -- the built resource is what `deploy.yml` ships, not a release asset.
      - name: Generate SHA256SUMS
        if: steps.tag.outputs.skip == ''
        run: |
          cd dist/release
          sha256sum *.tgz > SHA256SUMS

      - name: Attest build provenance
        if: steps.tag.outputs.skip == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/release/*.tgz

      # Draft, then attach, then publish — and every part of that order is load-bearing.
      #
      # Releases on this repository are **immutable**: a published release cannot take an
      # asset afterwards. `gh release create ... file.tgz` does not help, because it creates
      # the release and *then* uploads to it, which is the same `HTTP 422` one step further
      # in. A draft is the exception — it is not sealed until it is published — so the
      # tarballs go on while it is still a draft and publishing seals them in with it.
      #
      # v2026.08.31.41 and .42 are what this cost: both were published empty, both stamped
      # `immutable=true` at creation, and neither could be repaired afterwards even with the
      # repository setting turned off, because immutability is fixed when the release is
      # made rather than read at upload time. They were deleted rather than left as two
      # releases promising an SDK they do not carry.
      - name: Draft the release with all assets attached
        if: steps.tag.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --draft \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            dist/release/*.tgz \
            dist/release/SHA256SUMS

      # Separate step so a failure here is legible as "the assets are on, publishing failed"
      # rather than being buried in the call that did both.
      - name: Publish it, sealing the assets in
        if: steps.tag.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.tag.outputs.tag }}" --draft=false

name: License check

# REUSE compliance verification: every source file carries an SPDX header in its own
# comment syntax; `REUSE.toml` covers what cannot hold one (lockfiles, JSON, generated
# barrels, assets). This check is not part of `pnpm verify` (a Python tool, a potential
# install requirement) but runs in CI as a gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    name: Verify SPDX compliance
    runs-on: ubuntu-latest
    # Same carve-out as other jobs: skip the standing dev->main sync PR.
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image the fsfe/reuse-action wrapper builds `FROM`, run directly. The wrapper
      # is not mirrored where a Forgejo runner resolves actions from; the image is on
      # Docker Hub, which both hosts reach. Pinned by digest: `scripts/check-action-versions.js`
      # deliberately skips `docker://` and so cannot hold this one to a SHA.
      - name: Check REUSE compliance
        uses: docker://fsfe/reuse@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e # 6.2.0
        with:
          args: lint

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: /
    schedule:
      interval: 'weekly'
    groups:
      npm-deps:
        patterns: ['*']
    ignore:
      # TypeScript is split on purpose: root (client/, server/) is 7.x, web/ is 6.x,
      # because svelte-check needs the programmatic compiler API that 7.0 ships without
      # (AGENTS.md 3). Both live in one pnpm workspace and therefore one lockfile, which
      # is all Dependabot sees -- it cannot tell the two apart, so it proposed bumping
      # web/ to 7.0.2 (PR #27), Verify failed it, and it would have re-proposed the same
      # thing every week. Re-aligning is a deliberate one-time migration when 7.1 ships,
      # not a dependency bump; until then TypeScript moves by hand at both versions.
      - dependency-name: 'typescript'

  # Workflow actions were not watched, which is why they drifted onto a deprecated runtime
  # with nothing saying so: `upload-artifact@v4` and `pnpm/action-setup@v4` both target
  # Node 20, and the runner now forces them onto 24 and warns on every run. Dependabot
  # proposes versions that actually exist, which beats bumping a tag by hand and hoping.
  - package-ecosystem: 'github-actions'
    directory: /
    schedule:
      interval: 'weekly'
